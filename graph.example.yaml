# The instruction sheet of codeumbrella: the steps of the factory and the
# rules between them. `codeumbrella init` copies this file to
# `.codeumbrella/graph.yaml` in your project. Change that copy for your project.
# `codeumbrella init --update` replaces that copy with this file. It keeps the
# old one as `graph.yaml.before`, so move your changes back by hand.
#
# The lines that a step can have:
#
#   type       Who does the step. `worker` (the default), `person` or `command`.
#              worker:  an AI worker does the step.
#              person:  the run stops until you answer yes or no.
#              command: the supervisor runs the commands in `run`. No AI.
#   role       Only for a worker step. The rules page of the worker is
#              `.codeumbrella/roles/<role>.md`. You can add your own roles.
#              A new role must also have its two settings files in that
#              folder: `<role>.claude.json` and `<role>.codex.txt`.
#   run        Only for a command step. A list of commands. Each command is a
#              list of words. In a word, {run} is the id of the run.
#              If a command gives an error, the result of the step is bad.
#   reads      The papers that the step reads. A paper is a folder of files
#              that one step writes for other steps.
#   writes     The papers that the step writes. No other worker can change them.
#              You can change a paper while the run waits for your answer.
#   next       The step after a good result. With no `next`, the run ends.
#              The next worker gets the short result of the step before.
#   on_bad     The step after a bad result. With no `on_bad`, a bad result
#              stops the run. The step that `on_bad` goes to must have `max_tries`.
#              For a person step, a no is a bad result. The text that you give
#              with the no goes to the next worker.
#   max_tries  The maximum number of times that the run does this step.
#              At the maximum, the run stops and tells you. The count is for
#              the full run. The command `resume` sets it to 0 for that step.

# The name of the first step.
start: plan

steps:
  # A planner writes the description of the work and the tests.
  plan:
    role: planner
    writes: [spec, tests]
    max_tries: 3
    next: look_at_tests

  # You look at the tests. A no sends the work back to the planner.
  # When you trust the planner, remove this step and change `next` of `plan`.
  look_at_tests:
    type: person
    on_bad: plan
    next: build

  # A builder writes the code and commits it.
  build:
    role: builder
    reads: [spec]
    next: check

  # A checker runs the tests. A bad result goes to the repair step.
  check:
    role: checker
    reads: [spec, tests]
    on_bad: repair
    next: no_locked_files

  # A builder repairs the code. Then the checker looks again.
  # The builder gets the report of the checker.
  # The 3 tries are for all the bad checks of one run.
  repair:
    role: builder
    reads: [spec]
    max_tries: 3
    next: check

  # The run stops here if the work changes a file in a locked folder.
  # A worker cannot write to these folders, but git can put such a file
  # into a commit. Remove a folder from the last command if your task must
  # change it.
  # A worker can write to the `.git` folder of the project. Thus this step
  # and the push use a clean copy in the run folder, which no worker can
  # write to. The copy gets the code of GitHub from GitHub, and only the
  # branch of the run from the project.
  no_locked_files:
    type: command
    run:
      - [git, init, --quiet, ".codeumbrella/runs/{run}/clean"]
      - [git, -C, ".codeumbrella/runs/{run}/clean", config, include.path, ../../../../../.git/config]
      - [git, -C, ".codeumbrella/runs/{run}/clean", fetch, --quiet, --recurse-submodules=no, origin]
      - [git, -C, ".codeumbrella/runs/{run}/clean", remote, set-head, origin, --auto]
      - [git, -C, ".codeumbrella/runs/{run}/clean", fetch, --quiet, --recurse-submodules=no, ../../../.., "+refs/heads/codeumbrella/{run}:refs/heads/codeumbrella/{run}"]
      - [git, -C, ".codeumbrella/runs/{run}/clean", --no-replace-objects, diff, --quiet, --no-ext-diff, --no-textconv, --ignore-submodules=all, "refs/remotes/origin/HEAD...refs/heads/codeumbrella/{run}", --, .github, .claude, .codeumbrella]
    next: push

  # The supervisor sends the code to GitHub. No worker can push or merge.
  # Change the three steps below if your project does not use GitHub.
  # The push sends the commit that the step before looked at, from the
  # clean copy. The two full names make it go only to the branch of the run.
  push:
    type: command
    run:
      - [git, -C, ".codeumbrella/runs/{run}/clean", push, --quiet, origin, "refs/heads/codeumbrella/{run}:refs/heads/codeumbrella/{run}"]
    next: find_pr

  # Is there a PR for this run? Yes: go to your approval. No: open one.
  find_pr:
    type: command
    run:
      - [gh, pr, view, "codeumbrella/{run}", --json, url, --jq, .url]
    on_bad: open_pr
    next: approval

  open_pr:
    type: command
    run:
      - [gh, pr, create, --head, "codeumbrella/{run}", --fill]
    max_tries: 2
    next: approval

  # You look at the PR on GitHub and answer yes or no.
  # A no with your text sends the work to the planner. The planner corrects
  # the spec and the tests. You then see the tests again.
  approval:
    type: person
    on_bad: plan
    next: merge

  # GitHub refuses the merge if a necessary check of the PR is not good.
  # Other merge types are --merge and --rebase.
  merge:
    type: command
    run:
      - [gh, pr, merge, "codeumbrella/{run}", --squash]
