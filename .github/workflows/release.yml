# A GitHub machine builds the macOS command of each commit of `master` and uploads it
# to Cloudsmith. A new computer then gets the command with no Rust build.
name: release

# The upload runs after each merge to `master`. A PR by hand can change the
# code with no new version, so each file has the name of its commit.
# `install.sh` gets the file of the commit that a folder has. A person can
# also start the upload by hand on the GitHub page.
on:
  push:
    branches: [master]
  workflow_dispatch:

# `id-token: write` lets GitHub give this run a short token that tells which
# project and branch it is. Cloudsmith trusts that token, so no key is kept
# as a secret.
# The step for the GitHub release is in a second machine, with its own right.
permissions:
  contents: read
  id-token: write

env:
  CLOUDSMITH_WORKSPACE: tester-mjrq
  CLOUDSMITH_REPO: tester-mjrq/tester
  CLOUDSMITH_SERVICE_SLUG: github-codeumbrella

jobs:
  macos:
    # An upload only from `master` of this project, also for a start by hand.
    if: github.repository == 'blueman82/codeumbrella' && github.ref == 'refs/heads/master'
    # This machine has an Apple chip. The command does not run on an Intel Mac.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1, by its commit, so a moved tag changes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # `rust-toolchain.toml` sets the Rust version.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked
      # `install.sh` builds the same file name from the commit of a folder.
      - name: Pack the command
        run: |
          set -euo pipefail
          file="codeumbrella-$GITHUB_SHA-aarch64-apple-darwin.tar.gz"
          tar -czf "$file" -C target/release codeumbrella
          shasum -a 256 "$file" > "$file.sha256"
          echo "FILE=$file" >> "$GITHUB_ENV"
      # The second machine gets the two files from here.
      # actions/upload-artifact v7.0.2, by its commit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: command
          path: codeumbrella-*-aarch64-apple-darwin.tar.gz*
          if-no-files-found: error
          retention-days: 1
      # The Python of the GitHub Mac refuses a plain `pip install`. So the
      # Cloudsmith tool gets a Python folder of its own.
      - run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cloudsmith"
          "$RUNNER_TEMP/cloudsmith/bin/pip" install cloudsmith-cli==1.31.3
      # Cloudsmith refuses a second file with the same name and version. So a
      # second start for one commit makes this step bad, and the files in
      # Cloudsmith stay as they are.
      - name: Upload to Cloudsmith
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/cloudsmith/bin"
          "$bin/cloudsmith" push raw "$CLOUDSMITH_REPO" "$FILE" \
            --name codeumbrella-aarch64-apple-darwin --version "$GITHUB_SHA"
          "$bin/cloudsmith" push raw "$CLOUDSMITH_REPO" "$FILE.sha256" \
            --name codeumbrella-aarch64-apple-darwin-sha256 --version "$GITHUB_SHA"

  # A new version in `Cargo.toml` gets a GitHub release with the built
  # command. A version that has a release gets no second one. Only this
  # machine can write a release. It runs no code of the project and no code
  # of a package: it gets the built files and reads `Cargo.toml` from GitHub.
  # It does not use Cloudsmith.
  github-release:
    needs: macos
    if: github.repository == 'blueman82/codeumbrella' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2, by its commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: command
      - name: Make a GitHub release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw' |
            sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          # Only three numbers with points are a version.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "The release v$version is there."
            exit 0
          fi
          # A tag with no release is not from this step. The step does not
          # put the built command on a tag that it did not make.
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "Stop: the tag v$version is there, but it has no release."
            exit 1
          fi
          named="codeumbrella-$version-aarch64-apple-darwin.tar.gz"
          cp "codeumbrella-$GITHUB_SHA-aarch64-apple-darwin.tar.gz" "$named"
          sha256sum "$named" > "$named.sha256"
          gh release create "v$version" "$named" "$named.sha256" \
            --target "$GITHUB_SHA" --title "codeumbrella $version" --generate-notes
