# The instruction sheet: the steps of the factory and the rules between them.
start: plan
steps:
  plan:
    role: planner
    writes: [spec, tests]
    max_tries: 3
    next: look_at_tests
  look_at_tests:
    type: person
    on_bad: plan
    next: build
  build:
    role: builder
    reads: [spec]
    next: check
  check:
    role: checker
    reads: [spec, tests]
    on_bad: repair
    next: open_pr
  repair:
    role: builder
    reads: [spec]
    max_tries: 3
    # on_limit has one possible value. The run always stops at max_tries,
    # with or without this line. The line only tells the reader what occurs.
    on_limit: stop_for_person
    next: check
  # The supervisor runs these commands itself. No worker can push or merge.
  # In a word, {run} is the id of the run.
  open_pr:
    type: command
    run:
      - [git, push, --set-upstream, origin, "codeumbrella/{run}"]
      - [gh, pr, create, --head, "codeumbrella/{run}", --fill]
    next: approval
  # The person looks at the PR on GitHub and answers yes or no.
  approval:
    type: person
    next: merge
  # GitHub refuses the merge if a necessary check of the PR is not good.
  merge:
    type: command
    run:
      - [gh, pr, merge, "codeumbrella/{run}", --squash]
