# The settings of `cargo deny check` for the folder `fuzz/` only.

[advisories]
# A known safety problem in a package stops the check.
yanked = "deny"

[licenses]
# NCSA is the license of libFuzzer. Nobody receives the fuzz code.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "NCSA"]

[licenses.private]
# Codeumbrella is not on crates.io, so the check ignores it.
ignore = true

[bans]
multiple-versions = "warn"

[sources]
# Packages come only from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
